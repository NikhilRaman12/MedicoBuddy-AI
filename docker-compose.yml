# ──────────────────────────────────────────────────────────────
# MedicoBuddy AI — Single-Secret Open-Source Docker Compose
#
# Architecture:
#   medicobuddy-streamlit       → Streamlit UI (public :8501)
#   medicobuddy-fastapi         → FastAPI backend (public :8000)
#   medicobuddy-postgres-pgvector → PostgreSQL + pgvector (internal only)
#   medicobuddy-neo4j-community   → Neo4j Community Edition (internal only)
#
# Usage:
#   cp .env.example .env   # Add your GROQ_API_KEY
#   docker compose up --build
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL + pgvector (internal only) ──────────────────
  medicobuddy-postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: medicobuddy-postgres-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicobuddy}
      POSTGRES_USER: ${POSTGRES_USER:-medicobuddy_internal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicobuddy_dev}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicobuddy_internal} -d ${POSTGRES_DB:-medicobuddy}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - medicobuddy_net
    restart: unless-stopped
    # NO port mapping — internal network only

  # ── Neo4j Community Edition (internal only) ────────────────
  medicobuddy-neo4j-community:
    image: neo4j:5-community
    container_name: medicobuddy-neo4j-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-medicobuddy_dev}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - medicobuddy_net
    restart: unless-stopped
    # NO port mapping — internal network only

  # ── FastAPI Backend (public :8000) ─────────────────────────
  medicobuddy-fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: medicobuddy-fastapi
    ports:
      - "8000:8000"
    environment:
      # THE ONLY EXTERNAL SECRET
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Embedding (local)
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Internal database credentials (matching the DB containers above)
      POSTGRES_HOST: medicobuddy-postgres-pgvector
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-medicobuddy}
      POSTGRES_USER: ${POSTGRES_USER:-medicobuddy_internal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicobuddy_dev}
      # Neo4j internal
      NEO4J_URI: bolt://medicobuddy-neo4j-community:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-medicobuddy_dev}
      NEO4J_EDITION: community
      # MCP disabled by default
      MCP_ENABLED: "false"
      # App
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      medicobuddy-postgres-pgvector:
        condition: service_healthy
      medicobuddy-neo4j-community:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
      - model_cache:/root/.cache
    entrypoint: ["bash", "scripts/bootstrap.sh"]
    networks:
      - medicobuddy_net
    restart: unless-stopped

  # ── Streamlit Frontend (public :8501) ──────────────────────
  medicobuddy-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: medicobuddy-streamlit
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://medicobuddy-fastapi:8000/api/v1
      HEALTH_URL: http://medicobuddy-fastapi:8000/health/ready
    depends_on:
      medicobuddy-fastapi:
        condition: service_started
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    networks:
      - medicobuddy_net
    restart: unless-stopped

volumes:
  pgvector_data:
    driver: local
  neo4j_data:
    driver: local
  model_cache:
    driver: local

networks:
  medicobuddy_net:
    driver: bridge
