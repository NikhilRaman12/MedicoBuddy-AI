[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medicobuddy"
version = "0.1.0"
description = "Safety-first, evidence-grounded GraphRAG wellness assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    # LangGraph / LangChain
    "langgraph>=0.4.0,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-groq>=0.2.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    # Model Context Protocol (MCP) & Databases
    "mcp>=1.2.0,<2.0",
    "neo4j>=5.27.0,<6.0",
    "pymilvus>=2.5.0,<3.0",
    "pgvector>=0.3.0,<1.0",
    "asyncpg>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "redis>=5.2.0,<6.0",
    # Embeddings & Transformers
    "sentence-transformers>=3.4.0,<4.0",
    "transformers>=4.48.0,<5.0",
    "torch>=2.2.0",
    # HTTP clients for MCP connectors
    "httpx>=0.28.0,<1.0",
    "aiohttp>=3.11.0,<4.0",
    # XML parsing (PubMed, etc.)
    "lxml>=5.3.0,<6.0",
    # Observability
    "opentelemetry-api>=1.29.0,<2.0",
    "opentelemetry-sdk>=1.29.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "structlog>=24.4.0,<25.0",
    # Security
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-httpx>=0.35.0,<1.0",
    "ruff>=0.9.0,<1.0",
    "mypy>=1.14.0,<2.0",
    "bandit>=1.8.0,<2.0",
    "pre-commit>=4.0.0,<5.0",
    "httpx>=0.28.0,<1.0",
]
frontend = [
    "streamlit>=1.41.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medicobuddy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "safety: marks tests as safety-critical (deselect with '-m \"not safety\"')",
    "adversarial: marks adversarial prompt injection tests",
    "integration: marks integration tests requiring running services",
]
